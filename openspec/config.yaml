schema: spec-driven

# Project context: guardrails for all OpenSpec artifacts of this repository.
# Origin: split from openspec/config.yaml of https://github.com/mytracks/gpsloader (change split-repositories,
# 2026-11-19). The planning history up to then is there under openspec/changes/archive/ (in German).
context: |
  ## Product
  GPSLoggerKitGPL is a Swift package for file formats and device protocols of GPS loggers that are ported
  from source code under the GPL or a license compatible with it. It complements GPSLoggerKit (MIT,
  repository mytracks/GPSLoggerKit) and builds on its data model, FormatCatalog and device interface
  (DeviceConnection/DeviceProtocol). It is used by myTracks Loader (repository mytracks/gpsloader), by
  package URL and version.

  ## Language (decided by the developer on 2026-11-19)
  - All files in this repository are in English, including OpenSpec artifacts. The conversation with the
    developer is in German. Localized format names exist in German and English.

  ## License and platform (decided on 2026-11-10, change gpl-driver-package in gpsloader)
  - License: GPL-3.0-or-later. Every app that uses the package is covered by the GPL as a whole.
    myTracks Neo (App Store, closed source) must therefore not use it.
  - macOS 12+ only (no iOS: App Store terms and the GPL are not compatible).
  - Depends only on GPSLoggerKit (by URL, `.upToNextMinor`) and the system libraries. GPSLoggerKit never
    depends on this package.
  - Swift only: Swift 6 language mode, strict concurrency, no third-party packages.
  - Everything testable without hardware (fixtures, simulated devices). No real location data.
  - Versions according to Semantic Versioning, Git tags like `0.1.0`, starting with 0.1.0 (decided on
    2026-11-19).

  ## Porting rules
  - GPL source code may only be read in a change whose proposal assigns the family to this package, and
    only for this family.
  - No way back: once GPL source code has been read for a family, it stays in this package.
  - If a port needs something new in GPSLoggerKit, then only as a change of its own there, in generic form
    and without code from the template (clean-room rule of GPSLoggerKit). Otherwise helpers belong in
    this package.
  - Permitted licenses of the templates: GPL-2.0-or-later, GPL-3.0(-or-later), LGPL-2.1-or-later,
    CC BY-SA 4.0, MIT, BSD, Apache 2.0, public domain. Not permitted: GPL-2.0-only, CC BY-SA up to 3.0,
    licenses of their own and sources without a license, as long as the authors grant no compatible
    license.
  - gpsbabel templates from the tag `gpsbabel_1_7_0` (matching the binary of the old app); sources are
    loaded into a temporary folder, never into the repository. The gpsbabel binary only serves black-box
    cross-checks, as a process with an argument array, never through a shell.
  - Every ported file carries a header with the template (project, path, tag/commit), the copyright
    notice and license of the template, a note on translation and modification with the date and
    `SPDX-License-Identifier: GPL-3.0-or-later`. PROVENANCE.md has a section per format,
    `GPLFileFormats.credits` an entry per source project (shown in the About window of the app).

  ## Families in this package
  - From gpsbabel 1.7.0 (GPL-2.0-or-later): SkyTraq (skytraq-bin and device protocol), MTK/Holux
    (mtk-bin, m241-bin, device protocol), Wintec (wintec-tes, wbt-bin, wbt-tk1, device protocol),
    Locosys/Navilink (sbp, sbn, device protocol), Medion GoPal, Magellan (magellan, magellanx, device
    protocol), XAiOX iTrackU (device protocol), Alan Map500 (alantrl).
  - i-GotU: device protocol from the developer's own myTracks code and igotu2gpx 0.3.0
    (GPL-3.0-or-later). Erasing is marked "experimental".
  - Device catalog, transports (serial, USB HID, Bluetooth) and UI belong to the app (gpsloader).

  ## Development conditions
  - The developer is very experienced with macOS and myTracks. The developer has no i-GotU and no
    Bluetooth loggers; users test those.
  - Old sources in the neighboring checkout (read only): ../gpsloader/input/mytracks4mac/, functional
    analysis ../gpsloader/docs/legacy-analysis.md.
  - A change modifies only this repository; the app takes over new versions with changes of its own.

rules:
  proposal:
    - Write in English.
    - Name the affected devices and driver families explicitly.
    - Always include a section "Out of scope".
    - For a new family name the templates with their licenses and get the developer's decision on the
      assignment to this package.
    - State whether the change is compatible for the app (patch, minor version).
  specs:
    - Write in English. Every requirement statement contains the keyword SHALL or MUST.
    - Requirement texts at most 500 characters; examples and edge cases go into scenarios.
    - Scenarios in WHEN/THEN form, testable without hardware.
    - Protocol details (commands, answer formats, byte layouts) belong in the specs of the family.
  design:
    - Write in English.
    - Name every template with project, path, tag/commit and the quoted license statement (file and line).
    - "Handle Swift 6 concurrency explicitly: isolation, Sendable, timeouts, cancellation."
  tasks:
    - Write in English.
    - Every protocol/parser task has a test task with fixtures.
    - Manual hardware tests as "[manual, hardware]", tests by users as "[manual, user]".
